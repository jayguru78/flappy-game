<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flappy Game</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="game-container">

    <div class="top-bar">
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">1</span></div>
    </div>

    <canvas id="gameCanvas"
            width="400"
            height="600">
    </canvas>

    <div id="message">
        <h1>FLAPPY GAME</h1>
        <p>Tap / Space to Start</p>
    </div>

    <button id="restart">RESTART</button>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const levelText = document.getElementById("level");
const message = document.getElementById("message");
const restartButton = document.getElementById("restart");

let bird;
let pipes;
let score;
let level;
let gameRunning;
let gameOver;
let frame;

function resetGame() {

    bird = {
        x: 80,
        y: 300,
        size: 18,
        velocity: 0,
        gravity: 0.45,
        jump: -7
    };

    pipes = [];
    score = 0;
    level = 1;
    frame = 0;

    gameRunning = false;
    gameOver = false;

    scoreText.textContent = score;
    levelText.textContent = level;

    message.style.display = "block";
    restartButton.style.display = "none";

    draw();
}

function startGame() {

    if (gameOver) {
        resetGame();
    }

    gameRunning = true;
    message.style.display = "none";

    bird.velocity = bird.jump;

    requestAnimationFrame(gameLoop);
}

function jump() {

    if (!gameRunning && !gameOver) {
        startGame();
        return;
    }

    if (gameRunning) {
        bird.velocity = bird.jump;
    }
}

function createPipe() {

    const gap = Math.max(115 - level * 3, 80);
    const minTop = 70;
    const maxTop = canvas.height - gap - 100;

    const topHeight =
        Math.floor(Math.random() * (maxTop - minTop)) + minTop;

    pipes.push({
        x: canvas.width,
        width: 60,
        top: topHeight,
        gap: gap,
        passed: false
    });
}

function update() {

    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    const speed = 2.5 + level * 0.35;

    if (frame % 100 === 0) {
        createPipe();
    }

    pipes.forEach(pipe => {
        pipe.x -= speed;

        if (!pipe.passed && pipe.x + pipe.width < bird.x) {

            pipe.passed = true;

            score++;

            scoreText.textContent = score;

            if (score % 5 === 0) {
                level++;
                levelText.textContent = level;
            }
        }
    });

    pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);

    if (bird.y - bird.size < 0 ||
        bird.y + bird.size > canvas.height) {

        endGame();
    }

    pipes.forEach(pipe => {

        const birdLeft = bird.x - bird.size;
        const birdRight = bird.x + bird.size;
        const birdTop = bird.y - bird.size;
        const birdBottom = bird.y + bird.size;

        const pipeLeft = pipe.x;
        const pipeRight = pipe.x + pipe.width;

        const hitX =
            birdRight > pipeLeft &&
            birdLeft < pipeRight;

        const hitY =
            birdTop < pipe.top ||
            birdBottom > pipe.top + pipe.gap;

        if (hitX && hitY) {
            endGame();
        }
    });
}

function endGame() {

    gameRunning = false;
    gameOver = true;

    message.style.display = "block";

    message.innerHTML = `
        <h1>GAME OVER</h1>
        <p>Score: ${score}</p>
        <p>Tap RESTART</p>
    `;

    restartButton.style.display = "block";
}

function drawBackground() {

    ctx.fillStyle = "#70c5ce";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffffff";
    ctx.globalAlpha = 0.7;

    ctx.beginPath();
    ctx.arc(80, 100, 25, 0, Math.PI * 2);
    ctx.arc(110, 100, 30, 0, Math.PI * 2);
    ctx.arc(140, 100, 22, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
}

function drawBird() {

    ctx.fillStyle = "#FFD43B";

    ctx.beginPath();
    ctx.arc(
        bird.x,
        bird.y,
        bird.size,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "#000";

    ctx.beginPath();
    ctx.arc(
        bird.x + 7,
        bird.y - 6,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "#ff7b00";

    ctx.beginPath();
    ctx.moveTo(bird.x + 16, bird.y);
    ctx.lineTo(bird.x + 28, bird.y + 5);
    ctx.lineTo(bird.x + 16, bird.y + 10);
    ctx.fill();
}

function drawPipes() {

    pipes.forEach(pipe => {

        ctx.fillStyle = "#36b24a";

        ctx.fillRect(
            pipe.x,
            0,
            pipe.width,
            pipe.top
        );

        ctx.fillRect(
            pipe.x,
            pipe.top + pipe.gap,
            pipe.width,
            canvas.height
        );
    });
}

function draw() {

    drawBackground();

    drawPipes();

    drawBird();
}

function gameLoop() {

    if (!gameRunning) {
        draw();
        return;
    }

    frame++;

    update();

    draw();

    requestAnimationFrame(gameLoop);
}

canvas.addEventListener("click", jump);

document.addEventListener("keydown", event => {

    if (event.code === "Space") {

        event.preventDefault();

        jump();
    }
});

restartButton.addEventListener("click", () => {

    resetGame();
    startGame();
});

resetGame();

</script>

</body>
</html>
